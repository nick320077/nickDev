services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - store-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      retries: 10
volumes:
  store-data:
